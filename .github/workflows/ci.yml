name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked CPU runtime
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q src scripts tests app.py
          git diff --check
      - name: Run offline unit and Streamlit tests
        run: python -m unittest discover -s tests -v
      - name: Verify published evaluation artifacts
        run: python scripts/check_evaluation.py
